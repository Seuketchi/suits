name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skills:
    name: Skills
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Pinned so a new validator rule can't turn every PR red overnight;
      # bump it on purpose. `plugin validate` needs no login.
      - name: Install the claude CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.301

      - name: Listing rules, docs pages, links, plugin validate
        run: npm run check-skills

      - name: Tests
        run: npm test
