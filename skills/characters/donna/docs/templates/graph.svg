<!-- Labelled graph (x against y), edit the numbers: change the POINTS polyline, the tick steps, the axis labels and the marked points.
     Keep it as an SVG file in src/img/ and offer it beside the PDF. Inline it in a <figure> so the figure caption numbers itself.
     Rules: both axes named with units, a grid at every tick, the line heavier than the grid, one mark per point the questions refer to. -->
